<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arduino Board Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #f0f4f8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .arduino-teal {
            color: #00979d;
        }
        .arduino-bg {
            background-color: #00979d;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="card max-w-md w-full p-8 text-center">
        <!-- Simple SVG Icon representing a chip/board -->
        <div class="flex justify-center mb-6">
            <svg class="w-20 h-20 arduino-teal" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z"></path>
            </svg>
        </div>

        <h1 class="text-3xl font-bold arduino-teal mb-4">
            Arduino Test
        </h1>
        
        <p class="text-gray-600 text-lg mb-6">
            Check your board — only works in IoT kits.
        </p>

        <div class="space-y-4">
            <div id="status-container" class="p-4 bg-teal-50 border border-teal-100 rounded-lg transition-colors">
                <p id="status-text" class="text-sm text-teal-800 font-medium">
                    Status: Waiting for connection...
                </p>
            </div>
            
            <button id="connect-btn" class="arduino-bg text-white font-semibold py-2 px-6 rounded-full hover:opacity-90 transition-opacity w-full">
                Connect to Board
            </button>
        </div>

        <footer class="mt-8 text-xs text-gray-400">
            Ensure your serial monitor is set to the correct baud rate.
        </footer>
    </div>

    <script>
        const connectBtn = document.getElementById('connect-btn');
        const statusText = document.getElementById('status-text');
        const statusContainer = document.getElementById('status-container');

        connectBtn.addEventListener('click', async () => {
            if (!("serial" in navigator)) {
                statusText.innerText = "Error: Web Serial not supported in this browser.";
                statusContainer.classList.replace('bg-teal-50', 'bg-red-50');
                statusContainer.classList.replace('border-teal-100', 'border-red-100');
                statusText.classList.replace('text-teal-800', 'text-red-800');
                return;
            }

            try {
                statusText.innerText = "Status: Selecting port...";
                const port = await navigator.serial.requestPort();
                await port.open({ baudRate: 9600 });
                
                statusText.innerText = "Status: Connected to IoT Kit!";
                statusContainer.classList.replace('bg-teal-50', 'bg-green-50');
                statusContainer.classList.replace('border-teal-100', 'border-green-100');
                statusText.classList.replace('text-teal-800', 'text-green-800');
                connectBtn.innerText = "Device Active";
                connectBtn.disabled = true;
                connectBtn.classList.add('opacity-50', 'cursor-not-allowed');

            } catch (err) {
                console.error(err);
                statusText.innerText = "Status: Connection failed or cancelled.";
            }
        });
    </script>
</body>
</html>
